[package]
name = "kobito"
version = "0.1.0"
edition = "2024"
description = "Autonomous coding agent orchestrator — works while you sleep, like the elves in the shoemaker's tale"
license = "ISC"
repository = "https://github.com/unhappychoice/kobito"
readme = "README.md"

[[bin]]
name = "kobito"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "5"
indicatif = "0.17"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
slug = "0.1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
